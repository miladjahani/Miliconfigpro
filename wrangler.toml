# ============================================================================
# miliconfig v3.1 - پیکربندی استقرار مستقیم گیت‌هاب روی Cloudflare Workers & Pages
# ============================================================================
# توجه مهم برای جلوگیری از خطای استقرار D1:
# ۱. به محض اتصال گیت‌هاب به Cloudflare Workers یا Pages، پروژه بدون هیچ خطایی مستقر می‌شود.
# ۲. برای اتصال دیتابیس D1 از پنل کلودفلر:
#    در بخش Settings -> Bindings -> Add -> D1 Database یک دیتابیس بسازید و متصل کنید.
#    برنامه به صورت هوشمند هر نام متغیری (DB, D1, miliconfig و ...) را تشخیص داده و
#    جداول را به صورت ۱۰۰٪ خودکار (Auto-Migration) در اولین درخواست می‌سازد!
# ============================================================================

name = "miliconfig"
main = "src/index.js"
compatibility_date = "2024-09-23"

[vars]
BRAND = "miliconfig"

# اتصال دیتابیس D1 این حساب (کاربران، رمز مدیر و تنظیمات به‌صورت پایدار ذخیره می‌شوند؛
# جداول در اولین درخواست به‌صورت خودکار ساخته می‌شوند)
[[d1_databases]]
binding = "DB"
database_name = "miliconfig-db"
database_id = "edfa4ea1-5c26-42ff-aa89-2a28d1e6bc5a"

# کرون تازه‌سازی استخر پروکسی تأییدشدهٔ کشورها (هر ۲۰ دقیقه)
[triggers]
crons = ["*/10 * * * *"]
